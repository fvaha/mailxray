[package]
name = "mailxrayd"
description = "HTTP daemon exposing mailxray-core attachment inspection"
version.workspace = true
edition.workspace = true
license = "AGPL-3.0-only"
rust-version.workspace = true
repository.workspace = true

[dependencies]
mailxray-core = { path = "../mailxray-core" }
zip = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "process", "time"] }
