<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>mailxray card demo</title>
  <link rel="stylesheet" href="mailxray-card.css">
  <style>
    body { background: #f4f5f7; margin: 0; padding: 32px; }
    main { max-width: 760px; margin: 0 auto; display: grid; gap: 16px; }
    h1 { font: 600 18px/1.3 system-ui, sans-serif; color: #333; margin: 0 0 4px; }
    p.hint { font: 13px/1.5 system-ui, sans-serif; color: #666; margin: 0 0 8px; }
  </style>
</head>
<body>
<main>
  <div>
    <h1>mailxray attachment card</h1>
    <p class="hint">
      Rendered by <code>web/mailxray-card.js</code> from the JSON that
      <code>POST /inspect</code> returns. No innerHTML, no eval: a member named
      <code>&lt;img src=x onerror=alert(1)&gt;.zip</code> is just text here.
    </p>
  </div>
  <div id="cards"></div>
</main>
<script src="mailxray-card.js"></script>
<script>
  fetch("demo-report.json")
    .then((r) => r.json())
    .then((report) => {
      document.getElementById("cards").append(
        MailxrayCard.render(report, {
          entryUrl: (member) => "mailxray-card-demo-not-a-real-url?path=" + encodeURIComponent(member),
        })
      );
    });
</script>
</body>
</html>
