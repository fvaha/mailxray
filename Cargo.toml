[workspace]
resolver = "3"
members = ["crates/mailxray-core", "crates/mailxrayd"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
repository = "https://git.vahid.im/vaha/mailxray"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
sha2 = "0.10"
zip = { version = "9", default-features = false, features = ["deflate"] }
flate2 = "1"
lopdf = "0.47"
cfb = "0.16"
thiserror = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
